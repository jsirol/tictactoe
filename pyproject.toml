[project]
name = "tictactoe"
version = "0.1.0"
description = "Configurable tic tac toe (five-in-a-row) with bot interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "numpy>=2.4.4",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
]
rl = [
  "torch>=2.3.0",
]

[project.scripts]
tictactoe = "tictactoe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["tictactoe"]
